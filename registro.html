<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro · Trazo</title>
  <link rel="stylesheet" href="/screens.css">
</head>

<body>
  <header>
    <a href="/login.html" aria-label="Volver"></a>
    <span>Crear cuenta</span>
    <span aria-hidden="true"></span>
  </header>
  <main>
    <section>
      <div>


        <p>Nueva cuenta</p>
        <h1>Empecemos</h1>
        <p>Crea tu perfil para realizar el primer envío.</p>

        <form>
          <div>
            <label>Nombre completo</label>
            <input placeholder="Ana Martínez">
          </div>
          <div>
            <label>Correo electrónico</label>
            <input type="email" placeholder="ana@correo.com">
          </div>
          <div>
            <label>Contraseña</label>
            <input type="password" placeholder="••••••••">
          </div>
          <div>
            <label>Repetir contraseña</label>
            <input type="password" placeholder="••••••••">
          </div>
        </form>

        <p>Acepto los términos y condiciones del servicio.</p>
        <button type="button" style="margin-top: 24px">Crear cuenta</button>
        <p>
          ¿Ya tienes una cuenta?
          <a href="/login.html">Inicia sesión</a>
        </p>
      </div>
    </section>
  </main>
</body>

</html>
