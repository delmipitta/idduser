<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo envío · Trazo</title>
  <link rel="stylesheet" href="/screens.css">
</head>

<body>
  <header>
    <a href="/inicio.html" aria-label="Volver"></a>
    <span>Nuevo envío</span>
    <span aria-hidden="true"></span>
  </header>

  <main>
    
    <section>
      <div>


        <p>Paso 1 de 2</p>
        <h1>Datos del paquete</h1>

        <form>
          <div>
            <label>Origen</label>
            <input placeholder="Ave. Hatuey 28, Santiago">
          </div>
          <div>
            <label>Destino</label>
            <input placeholder="Piandini, Santo Domingo">
          </div>
          <div>
            <label>Descripción</label>
            <input placeholder="Documentos personales">
          </div>
          <div>
            <div>
              <label>Peso</label>
              <input placeholder="1.2 kg">
            </div>
            <div>
              <label>Tamaño</label>
              <input placeholder="Pequeño">
            </div>
          </div>
        </form>

        <div>
          <div>
            <span>Distancia estimada</span>
            <strong>154 km</strong>
          </div>
          <div>
            <span>Precio estimado</span>
            <strong>RD$ 850</strong>
          </div>
        </div>

        <a href="/seguimiento.html">
          <button type="button" style="margin-top: 26px">Continuar</button>
        </a>
      </div>
    </section>
  </main>
</body>

</html>
