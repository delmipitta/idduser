<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña · Trazo</title>
  <link rel="stylesheet" href="/screens.css">
</head>

<body>
  <header>
    <a href="/login.html" aria-label="Volver"></a>
    <span>Recuperación</span>
    <span aria-hidden="true"></span>
  </header>
  <main>


    <section>
      <div>


        <p>Recupera tu acceso</p>
        <h1>Revisa tu correo</h1>
        <p>Enviaremos un código de seis dígitos al correo asociado a tu cuenta.</p>

        <div>
          <div>
            <label>Tu correo</label>
            <input type="email" placeholder="ana@correo.com">
          </div>
          <button type="button">Enviar código</button>
        </div>

        <div></div>
        <p style="color: #8a8794">Código de confirmación</p>
        <div>
          <span>4</span>
          <span>8</span>
          <span>2</span>
          <span>1</span>
          <span>0</span>
          <span>6</span>
        </div>

        <div>
          <div>
            <label>Nueva contraseña</label>
            <input type="password" placeholder="••••••••">
          </div>
          <div>
            <label>Repetir contraseña</label>
            <input type="password" placeholder="••••••••">
          </div>
          <button type="button">Actualizar contraseña</button>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
